name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (仅构建不推送)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from git tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Extracted version: $version"

      - name: Build
        run: dotnet build .\MarkWin2D\MarkWin2D.csproj --configuration Release -p:NoWarn=CS1591

      - name: Pack NuGet package
        shell: pwsh
        run: |
          $version = $env:VERSION
          $packArgs = @(
            'pack',
            '.\MarkWin2D\MarkWin2D.csproj',
            '--configuration', 'Release',
            '--no-build',
            '--output', './nupkg'
          )
          if ($version) {
            Write-Host "Using version from git tag: $version"
            $packArgs += '/p:PackageVersion=' + $version
          }
          & dotnet $packArgs

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg
          retention-days: 7

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: WWW4R4E

      - name: NuGet push
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path ./nupkg -Filter *.nupkg | Where-Object {
            $_.Name -notlike '*.symbols.nupkg'
          }
          foreach ($pkg in $packages) {
            Write-Host "Publishing: $($pkg.Name)"
            dotnet nuget push $pkg.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }